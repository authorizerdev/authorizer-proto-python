name: Release

# Publish to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) via pypa/gh-action-pypi-publish -
# no PYPI_API_TOKEN secret to store or rotate. This exact repo+workflow
# is registered as a trusted publisher for the `authorizer-proto` project
# at https://pypi.org/manage/project/authorizer-proto/settings/publishing/;
# PyPI verifies the workflow's identity directly via GitHub's OIDC token,
# scoped to this job by `id-token: write` below.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI Trusted Publishing
      contents: write # required for the GitHub Release step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
