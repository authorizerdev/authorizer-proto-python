[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authorizer-proto"
version = "0.2.0rc0"
description = "Generated protobuf/gRPC Python stubs for the Authorizer auth server API (authorizer.v1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The Authorizer Authors" }]
keywords = ["authorizer", "protobuf", "grpc", "authentication", "authorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# protobuf is the only hard runtime dep: the message stubs need it, and the REST
# transport in the consuming SDK parses grpc-gateway JSON via protojson using
# these message types. grpcio is optional — only the *_pb2_grpc stubs need it,
# and they are imported lazily only when the gRPC transport is used.
dependencies = ["protobuf>=5.27"]

[project.optional-dependencies]
grpc = ["grpcio>=1.60"]

[project.urls]
Homepage = "https://authorizer.dev"
Source = "https://github.com/authorizerdev/authorizer-proto-python"
"Proto schema" = "https://buf.build/authorizerdev/authorizer"

[tool.hatch.build.targets.wheel]
packages = ["src/authorizer_proto"]

[tool.hatch.build.targets.sdist]
include = ["src/authorizer_proto", "scripts", "buf.gen.yaml", "README.md", "LICENSE"]
